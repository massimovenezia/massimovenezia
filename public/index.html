<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Todo lo que hago, en un solo lugar." />

    <meta property="og:title" content="Massimo Venezia" />
    <meta property="og:description" content="Todo lo que hago, en un solo lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://massimovenezia.com" />
    <meta property="og:image" content="https://massimovenezia.com/assets/og-image.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/styles.css" />

  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main>
      <div class="avatar-wrap reveal" style="--delay: 0s">
        <div class="avatar-glow"></div>
        <div class="avatar"></div>
      </div>

      <p class="eyebrow reveal" style="--delay: 0.1s"></p>

      <h1 class="name reveal" style="--delay: 0.18s">
        <span class="first"></span>
        <span class="last"></span>
      </h1>

      <p class="tagline reveal" style="--delay: 0.3s"></p>

      <div class="divider reveal" style="--delay: 0.4s">
        <span></span>
        <span class="mark"></span>
        <span></span>
      </div>

      <ul class="links"></ul>

      <footer class="reveal"></footer>
    </main>

    <script src="/content.js"></script>
    <script src="/script.js"></script>
